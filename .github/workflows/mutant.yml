name: mutation tests
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Record per-test coverage
        run: SIMPLECOV=1 bundle exec rake test
      - run: |
          git fetch origin main
          bundle exec mutant run --fail-fast --selection context_map --since origin/main
